  'use strict';
  const ECHO = (root.ECHO = root.ECHO || {});
  const M4 = ECHO.Math.Mat4;

  class ParticleSystem {
    constructor(maxCount) {
      this.max = maxCount || 360;
      this.pool = [];
      for (let i = 0; i < this.max; i++) {
        this.pool.push({ active: false, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, size: 0.1, r: 1, g: 1, b: 1, a: 1, age: 0, life: 1, ambient: false });
      }
      this.cursor = 0;
      this.rng = ECHO.Math.createRNG(88173);
      this.seededWorld = null;
    }

    spawn(x, y, z, vx, vy, vz, size, r, g, b, a, life, ambient) {
      for (let tries = 0; tries < this.max; tries++) {
        const idx = (this.cursor + tries) % this.max;
        const p = this.pool[idx];
        if (!p.active || (!ambient && p.ambient && tries > this.max * 0.6)) {
          this.cursor = (idx + 1) % this.max;
          p.active = true;
          p.x = x; p.y = y; p.z = z;
          p.vx = vx; p.vy = vy; p.vz = vz;
          p.size = size; p.r = r; p.g = g; p.b = b; p.a = a;
          p.age = 0; p.life = life; p.ambient = !!ambient;
          return;
        }
      }
    }

    burst(x, y, z, count, color, speed, size, life, upward) {
      for (let i = 0; i < count; i++) {
        const a = this.rng() * Math.PI * 2;
        const sp = (0.35 + this.rng() * 0.65) * (speed || 2.2);
        const vy = (upward || 1.2) * (0.4 + this.rng() * 0.9);
        this.spawn(
          x + (this.rng() - 0.5) * 0.4,
          y + (this.rng() - 0.5) * 0.3,
          z + (this.rng() - 0.5) * 0.4,
          Math.cos(a) * sp, vy, Math.sin(a) * sp,
          (size || 0.16) * (0.65 + this.rng() * 0.7),
          color[0], color[1], color[2], 0.85,
          (life || 1.1) * (0.7 + this.rng() * 0.6), false
        );
      }
    }

    clearAll() {
      for (let i = 0; i < this.max; i++) this.pool[i].active = false;
      this.seededWorld = null;
    }

    update(dt, worldId, focusPos, qualityTier) {
      const targetAmbient = qualityTier === 2 ? 150 : qualityTier === 1 ? 95 : 48;
      let ambientCount = 0;

      for (let i = 0; i < this.max; i++) {
        const p = this.pool[i];
        if (!p.active) continue;
        p.age += dt;
        if (p.age >= p.life) { p.active = false; continue; }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.z += p.vz * dt;
        if (p.ambient) {
          ambientCount++;
          // Gentle organic turbulence
          if (worldId === 'verdant') {
            p.x += Math.sin(p.age * 1.4 + i) * 0.14 * dt;
          } else if (worldId === 'violet') {
            p.y += 0.12 * dt;
          }
        } else {
          p.vx *= (1 - dt * 1.4);
          p.vz *= (1 - dt * 1.4);
          p.vy -= 0.4 * dt;
        }
      }

      // Replenish world-distinct ambient particles around focus
      const need = Math.min(12, targetAmbient - ambientCount);
      for (let k = 0; k < need; k++) {
        const ox = focusPos[0] + (this.rng() - 0.5) * 44;
        const oz = focusPos[2] + (this.rng() - 0.5) * 44;
        const oy = focusPos[1] + 0.3 + this.rng() * 11.5;
        if (worldId === 'amber') {
          this.spawn(ox, oy, oz, 1.05 + this.rng() * 0.5, -0.06, 0.35, 0.12 + this.rng() * 0.08, 0.98, 0.78, 0.48, 0.42, 4.5 + this.rng() * 4, true);
        } else if (worldId === 'verdant') {
          this.spawn(ox, oy, oz, (this.rng() - 0.5) * 0.25, 0.16 + this.rng() * 0.16, (this.rng() - 0.5) * 0.25, 0.13 + this.rng() * 0.09, 0.52, 0.98, 0.78, 0.55, 5.0 + this.rng() * 4, true);
        } else if (worldId === 'violet') {
          this.spawn(ox, oy - 3.0, oz, (this.rng() - 0.5) * 0.2, 0.42 + this.rng() * 0.45, (this.rng() - 0.5) * 0.2, 0.13 + this.rng() * 0.08, 0.80, 0.66, 1.0, 0.62, 5.0 + this.rng() * 4, true);
        } else {
          this.spawn(ox, oy, oz, (this.rng() - 0.5) * 0.16, 0.14 + this.rng() * 0.14, (this.rng() - 0.5) * 0.16, 0.12 + this.rng() * 0.07, 1.0, 0.95, 0.82, 0.46, 5.5 + this.rng() * 4, true);
        }
      }
    }

    fillBuffers(posSizeOut, colAlphaOut) {
      let count = 0;
      const limit = Math.min(this.max, posSizeOut.length / 4);
      for (let i = 0; i < this.max && count < limit; i++) {
        const p = this.pool[i];
        if (!p.active) continue;
        const t = p.age / p.life;
        const env = Math.sin(t * Math.PI);
        const o4 = count * 4;
        posSizeOut[o4 + 0] = p.x;
        posSizeOut[o4 + 1] = p.y;
        posSizeOut[o4 + 2] = p.z;
        posSizeOut[o4 + 3] = p.size * (0.7 + 0.3 * env);
        colAlphaOut[o4 + 0] = p.r;
        colAlphaOut[o4 + 1] = p.g;
        colAlphaOut[o4 + 2] = p.b;
        colAlphaOut[o4 + 3] = p.a * env;
        count++;
      }
      return count;
    }
  }

  class CreatureAnimator {
    constructor() {
      this.gaitPhase = 0;
      this.smoothSpeed = 0;
      this.wingOpen = 0;
      this.headYaw = 0;
      this.sensoryGlow = 0;
      this.bodyTiltX = 0;
      this.bodyTiltZ = 0;
      this.orbHoldPos = [0, 1.2, 0];
      this.orbLagInit = false;
      this.stepSoundTimer = 0;
      this.rippleTimer = 0;
    }

    update(dt, state, nearestInteractable, onFootstep) {
      const p = state.player;
      const speed = Math.hypot(p.vx, p.vz);
      this.smoothSpeed += (speed - this.smoothSpeed) * Math.min(1, dt * 10);

      // Advance procedural leg gait proportional to ground speed
      if (this.smoothSpeed > 0.08) {
        const prevPhase = this.gaitPhase;
        this.gaitPhase += this.smoothSpeed * dt * 2.45;
        // Trigger subtle footstep audio & water ripple every half-cycle
        if (Math.floor(this.gaitPhase / Math.PI) !== Math.floor(prevPhase / Math.PI)) {
          if (onFootstep) onFootstep(p.x, p.y, p.z, state.currentWorldId);
        }
      } else {
        // Settle gently back toward neutral stance
        const nearestRest = Math.round(this.gaitPhase / Math.PI) * Math.PI;
        this.gaitPhase += (nearestRest - this.gaitPhase) * Math.min(1, dt * 6);
      }

      // Carapace wing fold/unfold animation
      const wantWing = p.carriedOrb ? 1.0 : 0.0;
      this.wingOpen += (wantWing - this.wingOpen) * Math.min(1, dt * 7.5);

      // Subtle sensory organ glow & head look toward nearby interactable
      let wantGlow = 0.18;
      let wantHeadYaw = 0;
      if (nearestInteractable) {
        wantGlow = 0.95;
        const targetAngle = Math.atan2(nearestInteractable.item.x - p.x, nearestInteractable.item.z - p.z);
        wantHeadYaw = ECHO.Math.clamp(ECHO.Math.angleDiff(p.facing, targetAngle), -0.65, 0.65);
      }
      this.sensoryGlow += (wantGlow - this.sensoryGlow) * Math.min(1, dt * 8);
      this.headYaw += (wantHeadYaw - this.headYaw) * Math.min(1, dt * 8);

      // Inertial body pitch/roll during motion
      const forwardPitch = ECHO.Math.clamp(this.smoothSpeed * 0.032, 0, 0.18);
      this.bodyTiltX += (forwardPitch - this.bodyTiltX) * Math.min(1, dt * 8);

      // Smooth carried orb inertial hover right over the unfolded back carapace
      const bob = Math.sin(state.elapsedTime * 3.1) * 0.055;
      const backDist = -0.14;
      const targetOrbX = p.x + Math.sin(p.facing) * backDist;
      const targetOrbY = p.y + 1.38 + bob;
      const targetOrbZ = p.z + Math.cos(p.facing) * backDist;

      if (!this.orbLagInit || !p.carriedOrb) {
        this.orbHoldPos[0] = targetOrbX;
        this.orbHoldPos[1] = targetOrbY;
        this.orbHoldPos[2] = targetOrbZ;
        this.orbLagInit = !!p.carriedOrb;
      } else {
        const lag = Math.min(1, dt * 11.5);
        this.orbHoldPos[0] += (targetOrbX - this.orbHoldPos[0]) * lag;
        this.orbHoldPos[1] += (targetOrbY - this.orbHoldPos[1]) * lag;
        this.orbHoldPos[2] += (targetOrbZ - this.orbHoldPos[2]) * lag;
      }
    }

    // Draw articulated alien biomechanical creature (torso, head, sensory crystal, 2 wings, 4 two-segment legs!)
    render(renderer, state, isShadowPass) {
      const p = state.player;
      const time = state.elapsedTime;
      const strideAmp = ECHO.Math.clamp(this.smoothSpeed / 5.5, 0, 1);
      const bob = Math.abs(Math.sin(this.gaitPhase)) * 0.065 * strideAmp + Math.sin(time * 2.4) * 0.02;
      const bodyY = p.y + 0.62 + bob;
      const yaw = p.facing;
      const cosY = Math.cos(yaw), sinY = Math.sin(yaw);

      const toWorld = (lx, ly, lz) => [
        p.x + lx * cosY + lz * sinY,
        bodyY + ly,
        p.z - lx * sinY + lz * cosY
      ];

      // 1. Streamlined Armored Torso
      renderer.drawMesh(renderer.meshes.creatureBody, p.x, bodyY, p.z, this.bodyTiltX, yaw, 0, 0.92, 0.92, 0.92, null, 0, isShadowPass, false);

      // 2. Sculpted Head Shield + Glowing Sensory Organ
      const headPos = toWorld(0, 0.14, 0.56);
      renderer.drawMesh(renderer.meshes.creatureHead, headPos[0], headPos[1], headPos[2], 0.08, yaw + this.headYaw, 0, 0.88, 0.88, 0.88, null, 0, isShadowPass, false);
      if (!isShadowPass) {
        const sensPos = toWorld(0, 0.24, 0.72);
        const sensCol = p.carriedOrb ? ECHO.ORB_META[p.carriedOrb].emissive : [0.76, 0.96, 1.0];
        renderer.drawMesh(renderer.meshes.crystal, sensPos[0], sensPos[1], sensPos[2], 0, time * 1.4, 0, 0.11, 0.11, 0.11, sensCol, 0.65 + this.sensoryGlow * 1.1, false, false);
      }

      // 3. Hinged Back Carapace Wings (open gracefully to cradle World Orbs!)
      const wingAngle = 0.18 + this.wingOpen * 0.82;
      const leftWingPos = toWorld(-0.14, 0.24, -0.02);
      const rightWingPos = toWorld(0.14, 0.24, -0.02);
      renderer.drawMesh(renderer.meshes.creatureWing, leftWingPos[0], leftWingPos[1], leftWingPos[2], 0.05, yaw, -wingAngle, -0.95, 0.95, 0.95, null, 0, isShadowPass, false);
      renderer.drawMesh(renderer.meshes.creatureWing, rightWingPos[0], rightWingPos[1], rightWingPos[2], 0.05, yaw, wingAngle, 0.95, 0.95, 0.95, null, 0, isShadowPass, false);

      // 4. Four Slender Articulated Two-Segment Insectoid Legs (procedural gait!)
      const legSpecs = [
        { side: -1, hx: -0.32, hz: 0.28, phase: 0 },
        { side:  1, hx:  0.32, hz: 0.28, phase: Math.PI },
        { side: -1, hx: -0.30, hz: -0.28, phase: Math.PI },
        { side:  1, hx:  0.30, hz: -0.28, phase: 0 }
      ];
      for (let i = 0; i < 4; i++) {
        const leg = legSpecs[i];
        const ph = this.gaitPhase + leg.phase;
        const swing = Math.sin(ph) * 0.34 * strideAmp;
        const lift = Math.max(0, Math.cos(ph)) * 0.22 * strideAmp;

        const hip = toWorld(leg.hx, 0.02, leg.hz);
        // Upper femur angles outward and slightly up
        const femurPitch = swing * 0.65;
        const femurRoll = leg.side * (0.68 - lift * 0.45);
        renderer.drawMesh(renderer.meshes.creatureLegSeg, hip[0], hip[1], hip[2], femurPitch, yaw, femurRoll, 0.48, 0.48, 0.48, null, 0, isShadowPass, false);

        // Knee world position (approx endpoint of femur)
        const kneeLocalX = leg.hx + leg.side * Math.sin(Math.abs(femurRoll)) * 0.46;
        const kneeLocalY = 0.02 - Math.cos(Math.abs(femurRoll)) * 0.46 + lift * 0.14;
        const kneeLocalZ = leg.hz + Math.sin(femurPitch) * 0.42;
        const knee = toWorld(kneeLocalX, kneeLocalY, kneeLocalZ);

        // Lower tibia drops sharply toward ground height!
        const tibiaRoll = leg.side * (-0.18 + lift * 0.18);
        const tibiaPitch = -swing * 0.45;
        const tibiaLen = ECHO.Math.clamp((knee[1] - p.y) / 0.95, 0.28, 0.62);
        renderer.drawMesh(renderer.meshes.creatureLegSeg, knee[0], knee[1], knee[2], tibiaPitch, yaw, tibiaRoll, 0.42, tibiaLen, 0.42, null, 0, isShadowPass, false);
      }
    }
  }

  class SceneRenderer {
    constructor(renderer) {
      this.renderer = renderer;
      this.particles = new ParticleSystem(360);
      this.creature = new CreatureAnimator();
      this.frameCounter = 0;

      // Pre-generate Verdant reactive botanical fronds & Ending cosmic distant worlds deterministically!
      this.verdantFronds = [];
      {
        const rng = ECHO.Math.createRNG(55109);
        const clusters = [
          [-5.2, -3.5], [5.2, -3.5], [-5.2, 2.5], [5.2, 2.5],
          [-5.4, -14.0], [5.4, -14.0], [-4.5, -19.2], [4.5, -19.2],
          [14.2, -14.2], [14.2, -17.8], [24.0, -28.4], [24.0, -3.6]
        ];
        for (const [cx, cz] of clusters) {
          for (let k = 0; k < 4; k++) {
            this.verdantFronds.push({
              x: cx + (rng() - 0.5) * 2.2,
              y: -0.05,
              z: cz + (rng() - 0.5) * 2.2,
              rotY: rng() * Math.PI * 2,
              scale: 0.72 + rng() * 0.65
            });
          }
        }
      }

      // 36 Unique Distant Alien World-Orbs revealed in the Ending Sequence!
      this.cosmosWorlds = [];
      {
        const rng = ECHO.Math.createRNG(90909);
        const palette = [
          [0.95, 0.72, 0.38], [0.36, 0.88, 0.70], [0.74, 0.58, 0.98],
          [0.92, 0.89, 0.82], [0.52, 0.78, 0.96], [0.92, 0.56, 0.44],
          [0.72, 0.88, 0.62], [0.82, 0.74, 0.90]
        ];
        for (let i = 0; i < 36; i++) {
          const theta = rng() * Math.PI * 2;
          const phi = (rng() - 0.5) * Math.PI * 0.72;
          const dist = 68 + rng() * 145;
          let wy = 8 + Math.sin(phi) * dist * 0.65;
          // Keep upper-center title sky corridor clear for clean ending typography legibility
          if (wy > 26 && wy < 78) wy = (i % 2 === 0) ? wy + 34 : wy - 44;
          const col = palette[i % palette.length];
          this.cosmosWorlds.push({
            x: Math.cos(theta) * Math.cos(phi) * dist,
            y: wy,
            z: -10 + Math.sin(theta) * Math.cos(phi) * dist,
            r: 2.2 + rng() * 5.6,
            hasRing: rng() > 0.45,
            ringTilt: (rng() - 0.5) * 1.1,
            col,
            phase: rng() * Math.PI * 2
          });
        }
      }
    }

    // Draw all world entities (used for shadow pass, main render pass, AND offscreen orb interior preview!)
    drawWorldGeometry(worldId, state, isShadowPass, time, nearestInteractable, allowLiveOrbPreviews) {
      const r = this.renderer;
      const w = ECHO.WORLDS[worldId];
      const staticMesh = r.worldMeshes[worldId];
      if (staticMesh) {
        const allowFade = !isShadowPass && !state.flags.endingTriggered;
        r.drawMesh(staticMesh, 0, 0, 0, 0, 0, 0, 1, 1, 1, null, 0, isShadowPass, allowFade);
      }

      // 1. Dynamic Surfaces (Bridges, Vines, Rotated Aqueducts, Guardian #1 Arms)
      for (const ds of w.dynamicSurfaces) {
        if (ds.kind === 'guardian1_arm') continue; // drawn with Guardian #1 below
        const p = ECHO.Math.easeInOutCubic(state.animProgress[ds.id] || 0);

        if (ds.kind === 'mech_bridge' || ds.kind === 'sunken_bridge' || ds.kind === 'float_bridge') {
          const segs = ds.segments || 4;
          const tint = ds.style === 'ivory_gold' ? [0.95, 0.90, 0.78]
                     : ds.style === 'violet_stone' ? [0.56, 0.48, 0.80]
                     : [0.80, 0.58, 0.34];
          const isX = ds.axis === 'x';
          const totalLen = isX ? ds.hx * 2 : ds.hz * 2;
          const segLen = totalLen / segs;

          for (let i = 0; i < segs; i++) {
            const sp = ECHO.Math.clamp((p * (segs + 0.8) - i * 0.85) / 1.15, 0, 1);
            const se = ECHO.Math.easeOutCubic(sp);
            if (se < 0.01 && ds.kind !== 'sunken_bridge') continue;
            const offset = -totalLen * 0.5 + (i + 0.5) * segLen;
            const localX = isX ? offset : 0;
            const localZ = isX ? 0 : offset;
            const rotY = ds.rotY || 0;
            const c = Math.cos(rotY), s_ = Math.sin(rotY);
            const wx = ds.cx + localX * c - localZ * s_;
            const wz = ds.cz + localX * s_ + localZ * c;
            const dropY = ds.kind === 'sunken_bridge' ? -3.4 * (1 - se)
                        : ds.kind === 'float_bridge' ? -2.2 * (1 - se) + Math.sin(time * 1.8 + i) * 0.06 * se
                        : -1.4 * (1 - se);
            const sx = (isX ? segLen * 0.94 : ds.hx * 2) * (ds.kind === 'sunken_bridge' ? 1 : (0.25 + 0.75 * se));
            const sz = (isX ? ds.hz * 2 : segLen * 0.94) * (ds.kind === 'sunken_bridge' ? 1 : (0.25 + 0.75 * se));
            r.drawMesh(r.meshes.unitBox, wx, ds.y - 0.28 + dropY, wz, 0, rotY, 0, sx, 0.55, sz, tint, se * 0.06, isShadowPass, false);
          }
        } else if (ds.kind === 'vine_bridge') {
          if (p > 0.01) {
            const segs = 9;
            const len = ds.hx * 2;
            const tint = ds.style === 'pale_vine' ? [0.68, 0.95, 0.84] : [0.34, 0.84, 0.58];
            for (let i = 0; i < segs; i++) {
              const sp = ECHO.Math.clamp((p * (segs + 1.2) - i * 0.9) / 1.4, 0, 1);
              const se = ECHO.Math.easeOutBack(sp);
              if (sp <= 0.005) continue;
              const u = (i + 0.5) / segs;
              const vx = ds.cx - ds.hx + u * len;
              const archY = Math.sin(u * Math.PI) * 0.14;
              const wobble = Math.sin(i * 1.9 + time * 1.1) * 0.04;
              r.drawMesh(r.meshes.vineSeg, vx, ds.y - 0.12 + archY + wobble, ds.cz + Math.sin(i * 1.7) * 0.18, 0, Math.sin(i) * 0.2, 0, (len / segs) * 1.18 * se, se, ds.hz * 1.75 * se, tint, 0.08 * se, isShadowPass, false);
            }
          }
        } else if (ds.kind === 'rot_bridge' || ds.kind === 'rot_ramp') {
          const ang = ECHO.Math.lerp(ds.restAngle, ds.targetAngle, p);
          const lift = Math.sin(p * Math.PI) * 0.85;
          const tint = ds.style === 'ivory_gold' ? [0.95, 0.92, 0.84] : [0.64, 0.52, 0.86];
          const midY = ds.kind === 'rot_ramp' ? (ds.y0 + ds.y1) * 0.5 : ds.y;
          const pitch = ds.kind === 'rot_ramp' ? Math.atan2(ds.y1 - ds.y0, ds.hx * 2) * p : 0;
          r.drawMesh(r.meshes.unitBox, ds.cx, midY - 0.35 + lift, ds.cz, 0, ang, -pitch, ds.hx * 2, 0.7, ds.hz * 2, tint, 0.10 * p, isShadowPass, false);
          // Violet gravity highlight trim strip
          if (!isShadowPass) {
            r.drawMesh(r.meshes.unitRing, ds.cx, midY + 0.08 + lift, ds.cz, 0, time * 0.6, 0, 1.8, 1.0, 1.8, [0.76, 0.58, 1.0], 0.45 + p * 0.6, false, false);
          }
        }
      }

      // 2. Ground Energy Conduits (visible progressive segment-by-segment energy transmission!)
      if (!isShadowPass) {
        for (const c of w.conduits) {
          const prog = state.animProgress[c.id] || 0;
          const pts = c.points;
          // Calculate total conduit length
          let totalL = 0;
          const segLens = [];
          for (let i = 0; i < pts.length - 1; i++) {
            const l = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][2] - pts[i][2]);
            segLens.push(l);
            totalL += l;
          }
          let accum = 0;
          for (let i = 0; i < pts.length - 1; i++) {
            const a = pts[i], b = pts[i + 1];
            const sl = segLens[i];
            const mx = (a[0] + b[0]) * 0.5;
            const my = (a[1] + b[1]) * 0.5;
            const mz = (a[2] + b[2]) * 0.5;
            const ang = Math.atan2(b[0] - a[0], b[2] - a[2]);
            // Dormant dark etched channel
            r.drawMesh(r.meshes.unitBox, mx, my, mz, 0, ang, 0, 0.24, 0.04, sl, [0.22, 0.22, 0.24], 0, false, false);
            // Active illuminated pulse travelling along channel!
            const segStart = accum / Math.max(totalL, 0.01);
            const segEnd = (accum + sl) / Math.max(totalL, 0.01);
            const litFrac = ECHO.Math.clamp((prog - segStart) / Math.max(segEnd - segStart, 0.001), 0, 1);
            if (litFrac > 0.01) {
              const ax = a[0] + (b[0] - a[0]) * (litFrac * 0.5);
              const ay = a[1] + (b[1] - a[1]) * (litFrac * 0.5) + 0.025;
              const az = a[2] + (b[2] - a[2]) * (litFrac * 0.5);
              r.drawMesh(r.meshes.unitBox, ax, ay, az, 0, ang, 0, 0.16, 0.05, sl * litFrac, c.color, 1.35, false, false);
            }
            accum += sl;
          }
        }
      }

      // 3. Reactive Botanical Fronds in VERDANT
      if (worldId === 'verdant') {
        for (const f of this.verdantFronds) {
          const dp = Math.hypot(f.x - state.player.x, f.z - state.player.z);
          const lean = ECHO.Math.smoothstep(3.5, 0.5, dp) * 0.35;
          r.drawMesh(r.meshes.floraFrond, f.x, f.y, f.z, lean, f.rotY, 0, f.scale, f.scale, f.scale, null, 0, isShadowPass, false);
        }
      }

      // 4. Interactables (Unified Visual Language!)
      for (const it of w.interactables) {
        const isNear = nearestInteractable && nearestInteractable.item.id === it.id;
        const hi = isNear ? 0.65 + 0.25 * Math.sin(time * 4.5) : 0;

        if (it.type === 'dive') {
          const seated = state.getOrbOnPedestal(it.id);
          r.drawMesh(r.meshes.divePedestal, it.x, it.y, it.z, 0, 0, 0, 1, 1, 1, null, hi * 0.25, isShadowPass, false);
          if (!isShadowPass) {
            const ringTint = seated ? ECHO.ORB_META[seated].emissive : (it.tint || [0.85, 0.88, 0.95]);
            r.drawMesh(r.meshes.unitRing, it.x, it.y + 0.26, it.z, 0, time * 0.5, 0, 1.32, 1.0, 1.32, ringTint, 0.45 + (seated ? 0.55 : 0) + hi * 0.5, false, false);
          }
        } else if (it.type === 'dive_pad') {
          if (!isShadowPass) {
            const parentDive = state.getInteractableById(worldId, it.diveId);
            const seated = parentDive ? state.getOrbOnPedestal(parentDive.id) : null;
            const padCol = seated ? ECHO.ORB_META[seated].emissive : [0.55, 0.58, 0.62];
            const activeBoost = seated ? (0.75 + hi * 0.9) : 0.12;
            r.drawMesh(r.meshes.unitRing, it.x, it.y + 0.06, it.z, 0, -time * 0.8, 0, 0.85, 0.7, 0.85, padCol, activeBoost, false, false);
            if (seated) {
              r.drawMesh(r.meshes.unitRing, it.x, it.y + 0.12 + Math.sin(time * 3.0) * 0.04, it.z, 0, time * 1.1, 0, 0.52, 0.6, 0.52, padCol, 1.0 + hi, false, false);
            }
          }
        } else if (it.type === 'ascender') {
          r.drawMesh(r.meshes.ascenderBase, it.x, it.y, it.z, 0, 0, 0, 1, 1, 1, null, hi * 0.3, isShadowPass, false);
          if (!isShadowPass) {
            // Upward floating luminous rings showing "Ascend / Exit" with zero text!
            for (let k = 0; k < 3; k++) {
              const phase = (time * 0.55 + k / 3) % 1;
              const ry = it.y + 0.35 + phase * 3.4;
              const rs = 1.15 - phase * 0.55;
              r.drawMesh(r.meshes.unitRing, it.x, ry, it.z, 0, time * 0.4 + k, 0, rs, 0.6, rs, [0.92, 0.96, 1.0], (1 - phase) * (0.95 + hi), false, false);
            }
          }
        } else if (it.type === 'socket_amber' || it.type === 'triad_amber') {
          const unlocked = !it.unlockedByBoth || it.unlockedByBoth.every((f) => state.flags[f]);
          const riseY = unlocked ? 0 : -0.45;
          r.drawMesh(r.meshes.socketAmber, it.x, it.y + riseY, it.z, 0, 0, 0, 1, 1, 1, unlocked ? null : [0.55, 0.55, 0.58], hi * 0.4, isShadowPass, false);
        } else if (it.type === 'socket_verdant' || it.type === 'triad_verdant') {
          const unlocked = !it.unlockedByBoth || it.unlockedByBoth.every((f) => state.flags[f]);
          const riseY = unlocked ? 0 : -0.45;
          r.drawMesh(r.meshes.socketVerdant, it.x, it.y + riseY, it.z, 0, 0, 0, 1, 1, 1, unlocked ? null : [0.55, 0.55, 0.58], hi * 0.4, isShadowPass, false);
        } else if (it.type === 'socket_violet' || it.type === 'triad_violet') {
          const unlocked = !it.unlockedByBoth || it.unlockedByBoth.every((f) => state.flags[f]);
          const riseY = unlocked ? 0 : -0.45;
          r.drawMesh(r.meshes.socketViolet, it.x, it.y + riseY, it.z, 0, time * 0.45, 0, 1, 1, 1, unlocked ? null : [0.55, 0.55, 0.58], hi * 0.4, isShadowPass, false);
        } else if (it.type === 'rest' || it.type === 'vault_pedestal') {
          const unlocked = !it.unlockedBy || state.flags[it.unlockedBy];
          r.drawMesh(r.meshes.pedestalRest, it.x, it.y, it.z, 0, 0, 0, 1, 1, 1, null, hi * 0.3, isShadowPass, false);
          if (it.type === 'vault_pedestal' && !unlocked && !isShadowPass) {
            // Subtle violet seal cage around locked Violet Orb until Guardian #1 awakens!
            r.drawMesh(r.meshes.unitRing, it.x, it.y + 0.85, it.z, 0.6, time * 0.9, 0.3, 1.05, 0.8, 1.05, [0.78, 0.58, 1.0], 0.8, false, false);
            r.drawMesh(r.meshes.unitRing, it.x, it.y + 0.85, it.z, -0.6, -time * 0.7, 0.5, 1.05, 0.8, 1.05, [0.95, 0.72, 0.34], 0.6, false, false);
          }
        } else if (it.type === 'switch') {
          const on = !!state.flags[it.flag];
          const col = on ? (it.color || [1.0, 0.8, 0.4]) : [0.68, 0.68, 0.72];
          r.drawMesh(r.meshes.switchMonolith, it.x, it.y, it.z, 0, on ? time * 0.6 : 0, 0, 1, 1, 1, col, on ? 0.95 : (0.18 + hi * 0.75), isShadowPass, false);
        } else if (it.type === 'depth_resonator') {
          // 3-RING NESTED DEPTH RESONATOR on Guardian #2's Dais!
          // Outer Ring = Amber, Middle Ring = Verdant, Inner Ring = Violet
          const st = state.getDepthResonatorStatus();
          const aLit = st.ringAmber || state.flags.g2Awakened;
          const vLit = st.ringVerdant || state.flags.g2Awakened;
          const iLit = st.ringViolet || state.flags.g2Awakened;
          if (!isShadowPass) {
            r.drawMesh(r.meshes.unitRing, it.x, it.y + 0.08, it.z, 0, time * 0.25, 0, 2.55, 0.9, 2.55, aLit ? [1.0, 0.74, 0.28] : [0.34, 0.26, 0.18], aLit ? 1.35 : 0.06, false, false);
            r.drawMesh(r.meshes.unitRing, it.x, it.y + 0.10, it.z, 0, -time * 0.35, 0, 1.78, 0.9, 1.78, vLit ? [0.34, 0.96, 0.70] : [0.16, 0.30, 0.28], vLit ? 1.35 : 0.06, false, false);
            r.drawMesh(r.meshes.unitRing, it.x, it.y + 0.12, it.z, 0, time * 0.5, 0, 1.05, 0.9, 1.05, iLit ? [0.78, 0.60, 1.0] : [0.28, 0.22, 0.42], iLit ? 1.35 : 0.06, false, false);
            // Central resonant crystal
            r.drawMesh(r.meshes.crystal, it.x, it.y + 0.75 + Math.sin(time * 2.4) * 0.08, it.z, 0, time * 0.9, 0, 0.36, 0.58, 0.36, st.ready || state.flags.g2Awakened ? [0.96, 0.94, 1.0] : [0.54, 0.46, 0.74], st.ready || state.flags.g2Awakened ? 1.6 : (0.2 + hi * 0.5), false, false);
          }
        }
      }

      // 5. GUARDIAN #1 — THE RING COLOSSUS (VERDANT)
      if (worldId === 'verdant') {
        const g = w.guardian1;
        const g1 = state.guardian1;
        const bronze = [0.68, 0.52, 0.30];
        const goldLit = state.flags.g1Awakened ? [1.0, 0.80, 0.36] : state.flags.g1RelayNorth ? [0.90, 0.66, 0.30] : [0.50, 0.46, 0.38];

        // Massive rotating outer mechanical halo ring + counter-rotating inner ring
        r.drawMesh(r.meshes.heavyRing, g.cx, g.y + 0.55, g.cz, 0, g1.angle, 0, g.radius, 3.2, g.radius, bronze, state.flags.g1Awakened ? 0.22 : 0.04, isShadowPass, false);
        r.drawMesh(r.meshes.heavyRing, g.cx, g.y + 1.35, g.cz, 0, -g1.angle * 0.65, 0, 4.7, 2.2, 4.7, goldLit, state.flags.g1RelayNorth ? 0.35 : 0.05, isShadowPass, false);

        // 3 Sweeping Articulated Biomechanical Bridge Arms (120° apart)
        for (let k = 0; k < 3; k++) {
          const a = g1.angle + k * ((Math.PI * 2) / 3);
          const midR = 5.8;
          const ax = g.cx + Math.cos(a) * midR;
          const az = g.cz + Math.sin(a) * midR;
          r.drawMesh(r.meshes.unitBox, ax, g.y - 0.16, az, 0, -a, 0, 6.0, 0.52, 2.9, [0.58, 0.50, 0.36], 0.04, isShadowPass, false);
          // Raised golden biomechanical spine rib along outer rim of each arm
          const finX = g.cx + Math.cos(a) * 8.6;
          const finZ = g.cz + Math.sin(a) * 8.6;
          r.drawMesh(r.meshes.crystal, finX, g.y + 1.45, finZ, 0, -a, 0.25, 0.55, 1.55, 0.55, goldLit, state.flags.g1Awakened ? 0.95 : 0.22, isShadowPass, false);
        }

        // Central Awakening Lotus Petals around the Central Spire
        for (let k = 0; k < 6; k++) {
          const a = (k / 6) * Math.PI * 2 + g1.angle * 0.3;
          const open = 0.25 + g1.pulse * 0.65;
          const lx = g.cx + Math.cos(a) * 3.1;
          const lz = g.cz + Math.sin(a) * 3.1;
          r.drawMesh(r.meshes.unitBox, lx, g.y + 0.95, lz, open, -a + Math.PI * 0.5, 0, 0.65, 2.1, 0.24, goldLit, g1.pulse * 0.5, isShadowPass, false);
        }
      }

      // 6. GUARDIAN #2 — THE POLYHEDRAL SOVEREIGN (VIOLET)
      if (worldId === 'violet') {
        const g = w.guardian2;
        const g2 = state.guardian2;
        const hoverY = g.cy + Math.sin(time * 0.9) * 0.42;
        const sOut = g.radius * (1.0 + g2.unfold * 0.32);
        const sMid = g.radius * 0.68 * (1.0 + g2.unfold * 0.22);
        const sIn = g.radius * 0.36;

        // Outer Octahedral Brass-Stone Shell (aligns with Seal 1 / Amber)
        r.drawMesh(r.meshes.guardian2Outer, g.cx, hoverY, g.cz, g2.rotOuter * 0.35, g2.rotOuter, g2.rotOuter * 0.2, sOut, sOut, sOut, state.flags.g2SealWest ? [1.0, 0.80, 0.44] : [0.76, 0.66, 0.54], state.flags.g2SealWest ? 0.42 : 0.08, isShadowPass, false);
        // Middle Living Tri-Ring Lattice (aligns with Seal 2 / Verdant)
        r.drawMesh(r.meshes.guardian2Mid, g.cx, hoverY, g.cz, g2.rotMid * 0.5, g2.rotMid, -g2.rotMid * 0.3, sMid, sMid, sMid, state.flags.g2SealEast ? [0.46, 0.98, 0.76] : [0.34, 0.66, 0.58], state.flags.g2SealEast ? 0.52 : 0.12, isShadowPass, false);
        // Inner Radiant Silver-Violet Polyhedron Core
        r.drawMesh(r.meshes.crystal, g.cx, hoverY, g.cz, g2.rotInner * 0.6, g2.rotInner, 0, sIn, sIn * 1.25, sIn, [0.88, 0.76, 1.0], 0.95 + g2.unfold * 0.9, isShadowPass, false);

        // Orbiting fractured stone satellites
        for (let k = 0; k < 6; k++) {
          const oa = time * 0.25 + (k / 6) * Math.PI * 2;
          const orad = sOut * 1.28;
          r.drawMesh(r.meshes.unitBox, g.cx + Math.cos(oa) * orad, hoverY + Math.sin(oa * 2 + k) * 1.1, g.cz + Math.sin(oa) * orad, oa, -oa, 0.4, 0.55, 1.35, 0.55, [0.44, 0.38, 0.62], 0.12, isShadowPass, false);
        }

        // Cosmic Awakening Beam shooting skyward when solved at Depth 3!
        if (!isShadowPass && g2.beam > 0.02) {
          r.drawMesh(r.meshes.unitBox, g.cx, hoverY + 18, g.cz, 0, time * 0.8, 0, 0.9 * g2.beam, 42, 0.9 * g2.beam, [0.92, 0.88, 1.0], 1.6 * g2.beam, false, false);
        }
      }

      // 7. PALE ORIGIN GATE & COLOSSAL AWAKENING ORRERY + ENDING CHOREOGRAPHY!
      if (worldId === 'pale') {
        // Great Origin Gate Twin Monolith Doors (part wide when g2Awakened!)
        const gateOpen = state.flags.g2Awakened ? 1.0 : 0.0;
        const slide = gateOpen * 4.4;
        const doorCol = [0.90, 0.90, 0.88];
        r.drawMesh(r.meshes.unitBox, -1.9 - slide, 6.2, 16.8, 0, 0, 0, 3.6, 12.2, 1.1, doorCol, 0, isShadowPass, false);
        r.drawMesh(r.meshes.unitBox, 1.9 + slide, 6.2, 16.8, 0, 0, 0, 3.6, 12.2, 1.1, doorCol, 0, isShadowPass, false);

        // Colossal Central Awakening Sphere & 3 Giant Breathing Concentric Rings!
        const endT = state.flags.endingTriggered ? state.endingTime : 0;
        const ringSpeed = 1.0 + Math.min(endT * 0.45, 2.8);
        const breath = 1.0 + Math.sin(time * 0.85) * 0.035;
        const orreryY = 9.8;
        const ivory = [0.96, 0.95, 0.92];
        const paleGold = [0.96, 0.84, 0.54];
        const ringGlow = (state.flags.paleWestLocked ? 0.25 : 0) + (state.flags.paleEastLocked ? 0.25 : 0) + (state.flags.endingTriggered ? 0.7 : 0);

        r.drawMesh(r.meshes.sphere, 0, orreryY, -10.0, 0, time * 0.12, 0, 3.1 * breath, 3.1 * breath, 3.1 * breath, ivory, 0.18 + ringGlow * 0.55, isShadowPass, false);
        r.drawMesh(r.meshes.heavyRing, 0, orreryY, -10.0, 0.35 + time * 0.18 * ringSpeed, time * 0.22 * ringSpeed, 0, 4.9 * breath, 2.4, 4.9 * breath, paleGold, 0.25 + ringGlow, isShadowPass, false);
        r.drawMesh(r.meshes.heavyRing, 0, orreryY, -10.0, -0.55, -time * 0.28 * ringSpeed, 0.4 + time * 0.14 * ringSpeed, 6.6 * breath, 2.2, 6.6 * breath, ivory, 0.12 + ringGlow * 0.7, isShadowPass, false);
        r.drawMesh(r.meshes.heavyRing, 0, orreryY, -10.0, Math.PI * 0.5 + Math.sin(time * 0.3) * 0.2, time * 0.15 * ringSpeed, 0, 8.4 * breath, 2.6, 8.4 * breath, paleGold, 0.2 + ringGlow * 0.8, isShadowPass, false);

        // West & East Wing Harmonic Beams shooting into the Central Awakening Sphere!
        if (!isShadowPass && state.flags.paleWestLocked) {
          r.drawMesh(r.meshes.unitBox, -15.2, 6.4, -10.0, 0, 0, 0.22, 30.5, 0.22, 0.22, [1.0, 0.80, 0.40], 1.5, false, false);
        }
        if (!isShadowPass && state.flags.paleEastLocked) {
          r.drawMesh(r.meshes.unitBox, 15.2, 6.0, -10.0, 0, 0, -0.26, 30.5, 0.22, 0.22, [0.44, 0.96, 0.78], 1.5, false, false);
        }

        // ENDING SEQUENCE: Cosmic Pullback — Pearl Outer Shell & 36 Distant Alien Worlds!
        if (!isShadowPass && state.flags.endingTriggered && endT > 7.5) {
          const shellAppear = ECHO.Math.smoothstep(8.5, 16.0, endT);
          const cosmosAppear = ECHO.Math.smoothstep(10.0, 20.0, endT);
          // Translucent Pearl-White Outer World-Orb Ring enveloping Pale!
          if (shellAppear > 0.01) {
            r.drawMesh(r.meshes.unitRing, 0, 6.0, -10.0, 0.3, time * 0.12, 0.2, 38.0 * shellAppear, 3.2, 38.0 * shellAppear, [0.98, 0.96, 0.90], 1.15 * shellAppear, false, false);
            r.drawMesh(r.meshes.unitRing, 0, 6.0, -10.0, -0.5, -time * 0.09, 0.8, 38.5 * shellAppear, 2.4, 38.5 * shellAppear, [0.76, 0.88, 1.0], 0.95 * shellAppear, false, false);
          }
          // Dozens of distant alien worlds drifting peacefully across the vast cosmos!
          if (cosmosAppear > 0.01) {
            for (let i = 0; i < this.cosmosWorlds.length; i++) {
              const cw = this.cosmosWorlds[i];
              const wy = cw.y + Math.sin(time * 0.35 + cw.phase) * 1.4;
              const rad = cw.r * cosmosAppear;
              r.drawMesh(r.meshes.sphere, cw.x, wy, cw.z, 0, time * 0.1 + cw.phase, 0, rad, rad, rad, cw.col, 0.55 * cosmosAppear, false, false);
              if (cw.hasRing) {
                r.drawMesh(r.meshes.unitRing, cw.x, wy, cw.z, cw.ringTilt, time * 0.15 + cw.phase, 0.2, rad * 1.65, 1.0, rad * 1.65, cw.col, 0.7 * cosmosAppear, false, false);
              }
            }
          }
        }
      }

      // 8. Player Creature (drawn when rendering current world!)
      if (worldId === state.currentWorldId) {
        this.creature.render(r, state, isShadowPass);
      }

      // 9. World Orbs (Seated on pedestals, carried on creature back, or orbiting in Ending!)
      if (!isShadowPass) {
        this.drawWorldOrbs(worldId, state, time, nearestInteractable, allowLiveOrbPreviews);
      }
    }

    drawWorldOrbs(worldId, state, time, nearestInteractable, allowLivePreviews) {
      const r = this.renderer;
      const orbIds = ['amber', 'verdant', 'violet'];
      const endT = state.flags.endingTriggered ? state.endingTime : 0;

      for (let idx = 0; idx < orbIds.length; idx++) {
        const id = orbIds[idx];
        const o = state.orbs[id];
        if (!o) continue;

        // Ending sequence: All 3 orbs rise gracefully and orbit Pale's Central Awakening Sphere!
        if (worldId === 'pale' && state.flags.endingTriggered && endT > 1.5) {
          const lift = ECHO.Math.easeInOutCubic(ECHO.Math.clamp((endT - 1.5) / 4.8, 0, 1));
          const orbitAngle = time * (0.52 + idx * 0.14) + idx * ((Math.PI * 2) / 3);
          const orbitR = 5.4 + lift * (2.6 + idx * 1.4);
          const ox = ECHO.Math.lerp(o.x, Math.cos(orbitAngle) * orbitR, lift);
          const oy = ECHO.Math.lerp(o.y, 9.8 + Math.sin(orbitAngle * 1.5 + idx) * 2.5, lift);
          const oz = ECHO.Math.lerp(o.z, -10.0 + Math.sin(orbitAngle) * orbitR, lift);
          r.drawOrb(r._vp, this._activeCamPos, id, ox, oy, oz, 0.85 + lift * 0.42, time, 0.48, allowLivePreviews);
          continue;
        }

        if (o.location === 'carried' && worldId === state.currentWorldId) {
          let ox = this.creature.orbHoldPos[0];
          let oy = this.creature.orbHoldPos[1];
          let oz = this.creature.orbHoldPos[2];
          if (state.actionAnim && state.actionAnim.type === 'pickup' && state.actionAnim.orbId === id) {
            const t = ECHO.Math.easeOutBack(state.actionAnim.t / state.actionAnim.dur);
            ox = ECHO.Math.lerp(state.actionAnim.fromX, ox, t);
            oy = ECHO.Math.lerp(state.actionAnim.fromY, oy, t) + Math.sin(t * Math.PI) * 0.45;
            oz = ECHO.Math.lerp(state.actionAnim.fromZ, oz, t);
          }
          r.drawOrb(r._vp, this._activeCamPos, id, ox, oy, oz, 0.50, time, 0.35, allowLivePreviews);
        } else if (o.location === 'pedestal' && o.world === worldId) {
          const bob = Math.sin(time * 2.1 + idx * 2.0) * 0.08;
          let ox = o.x, oy = o.y + 0.18 + bob, oz = o.z;
          if (state.actionAnim && state.actionAnim.type === 'place' && state.actionAnim.orbId === id) {
            const t = ECHO.Math.easeOutCubic(state.actionAnim.t / state.actionAnim.dur);
            ox = ECHO.Math.lerp(this.creature.orbHoldPos[0], ox, t);
            oy = ECHO.Math.lerp(this.creature.orbHoldPos[1], oy, t) + Math.sin(t * Math.PI) * 0.35;
            oz = ECHO.Math.lerp(this.creature.orbHoldPos[2], oz, t);
          }
          const isNear = nearestInteractable && nearestInteractable.item.id === o.pedestalId;
          r.drawOrb(r._vp, this._activeCamPos, id, ox, oy, oz, 0.64, time, isNear ? 0.75 : 0.12, allowLivePreviews);
        }
      }
    }

    // Draw soft contact shadows & subtle ground interaction halos
    drawContactDecals(worldId, state, vp, time, nearestInteractable) {
      const gl = this.renderer.gl;
      const r = this.renderer;
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.depthMask(false);

      // Player soft ground contact shadow
      if (worldId === state.currentWorldId) {
        r.drawDecal(vp, state.player.x, state.player.y, state.player.z, 0.85, 0.05, 0.05, 0.08, 0.45, 0, time);
      }

      // Seated orb shadows & nearest interactable soft glowing ground ring
      for (const orbId of ['amber', 'verdant', 'violet']) {
        const o = state.orbs[orbId];
        if (o.location === 'pedestal' && o.world === worldId) {
          r.drawDecal(vp, o.x, o.y - 0.55, o.z, 0.95, 0.05, 0.04, 0.08, 0.36, 0, time);
        }
      }

      if (nearestInteractable) {
        const it = nearestInteractable.item;
        const c = it.type.includes('amber') ? [1.0, 0.76, 0.32]
                : it.type.includes('verdant') ? [0.36, 0.96, 0.70]
                : it.type.includes('violet') ? [0.78, 0.60, 1.0]
                : [0.95, 0.96, 1.0];
        r.drawDecal(vp, it.x, it.y, it.z, it.radius * 0.92, c[0], c[1], c[2], 0.62, 1, time);
      }

      gl.depthMask(true);
      gl.disable(gl.BLEND);
    }

    // Update one offscreen World Orb FBO preview per cycle (recursion depth strictly capped at 1!)
    updateOrbPreviews(state, time) {
      const r = this.renderer;
      if (r.qualityTier === 0) return;
      this.frameCounter++;
      const orbIds = ['amber', 'verdant', 'violet'];
      // Pick one visible orb that is NOT the current world (or dirty) to refresh smoothly
      let targetOrb = null;
      for (const id of orbIds) {
        const prev = r.orbPreviews[id];
        if (!prev) continue;
        if (prev.dirty) { targetOrb = id; break; }
      }
      if (!targetOrb && (this.frameCounter % (r.qualityTier === 2 ? 14 : 28) === 0)) {
        const idx = Math.floor(this.frameCounter / (r.qualityTier === 2 ? 14 : 28)) % orbIds.length;
        targetOrb = orbIds[idx];
      }
      if (!targetOrb) return;

      const prev = r.orbPreviews[targetOrb];
      const wCfg = ECHO.WORLDS[targetOrb];
      const gl = r.gl;
      const sz = r.orbPreviewSize;

      gl.bindFramebuffer(gl.FRAMEBUFFER, prev.fbo);
      gl.viewport(0, 0, sz, sz);
      gl.clearColor(wCfg.fogColor[0], wCfg.fogColor[1], wCfg.fogColor[2], 1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

      // Gentle orbiting camera inside the miniature world!
      const orbitA = time * 0.18;

          this.audio.playPickup(data.orbId);
          const col = ECHO.ORB_META[data.orbId].emissive;
          this.scene.particles.burst(this.state.player.x, this.state.player.y + 1.1, this.state.player.z, 22, col, 2.4, 0.16, 0.9, 1.4);
          if (data.orbId === 'verdant' || data.orbId === 'violet') {
            this.camera.focusBriefly(this.state.player.x, this.state.player.y + 1.2, this.state.player.z, 1.4, -3.5);
          }
        } else if (type === 'place_orb') {
          this.audio.playPlace(data.orbId);
          const col = ECHO.ORB_META[data.orbId].emissive;
          const it = this.state.getInteractableById(data.world, data.pedestalId);
          if (it) {
            this.scene.particles.burst(it.x, it.y + 0.8, it.z, 26, col, 2.8, 0.18, 1.1, 1.6);
          }
          if (this.renderer.orbPreviews[data.orbId]) {
            this.renderer.orbPreviews[data.orbId].dirty = true;
          }
        } else if (type === 'switch_activated') {
          this.audio.playSwitch();
          this.camera.addShake(0.24);
          this.scene.particles.burst(data.x, data.y + 0.9, data.z, 28, [1.0, 0.82, 0.44], 3.2, 0.18, 1.2, 2.0);
        } else if (type === 'mechanism_milestone') {
          this.camera.addShake(0.35);
          if (data.flag === 'g1Awakened') {
            this.audio.playGuardianAwaken();
            this.camera.focusBriefly(34.5, 0.8, -16.0, 2.4, 5.0);
            this.scene.particles.burst(24, 1.5, -16, 48, [1.0, 0.80, 0.36], 5.2, 0.24, 1.8, 3.0);
          } else if (data.flag === 'amberAqueductAligned' || data.flag === 'paleWestStairAligned') {
            this.audio.playSwitch();
            this.scene.particles.burst(data.x, data.y + 1.0, data.z, 36, [0.76, 0.58, 1.0], 3.6, 0.20, 1.4, 2.6);
          } else {
            this.audio.playSwitch();
          }
        } else if (type === 'guardian2_awakened') {
          this.audio.playGuardianAwaken();
          this.camera.addShake(0.45);
          this.camera.focusBriefly(0, 5.0, -18.5, 2.8, 6.0);
          this.scene.particles.burst(0, 4.8, -19.2, 60, [0.88, 0.78, 1.0], 6.0, 0.26, 2.0, 4.2);
        } else if (type === 'reject' || type === 'depth_resonator_incomplete') {
          this.audio.playReject();
          this.camera.addShake(0.14);
        } else if (type === 'pale_sanctum_entered') {
          this.showWorldBanner('PALE');
          this.camera.focusBriefly(0, 7.5, -10.0, 2.2, 7.0);
        } else if (type === 'ending_started') {
          this.input.clearAll();
          this.audio.playGuardianAwaken();
          this.elTopBar.classList.remove('visible');
          this._updateMobileVisibility();
          this.scene.particles.burst(0, 8.0, -10.0, 75, [1.0, 0.94, 0.78], 7.0, 0.28, 2.6, 3.5);
        } else if (type === 'world_changed') {
          this.scene.particles.clearAll();
          if (data.firstVisit && data.world !== 'pale') {
            this.showWorldBanner(ECHO.WORLDS[data.world].title);
          }
          // Mark source world preview dirty so its new state is visible inside the orb!
          if (data.fromWorld && this.renderer.orbPreviews[data.fromWorld]) {
            this.renderer.orbPreviews[data.fromWorld].dirty = true;
          }
        }
      });
    }

    _handleResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      this.renderer.resize(w, h);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      this.overlay.width = Math.max(320, Math.floor(w * dpr));
      this.overlay.height = Math.max(200, Math.floor(h * dpr));
      this.overlay.style.width = w + 'px';
      this.overlay.style.height = h + 'px';
      this._updateMobileVisibility();
    }

    // Unified Interact (Space / E / Mobile Button / Auto-on-click-arrival)
    tryInteract(preferredId) {
      if (this.mode !== 'playing' || this.camera.transition.active || this.state.flags.endingTriggered) return false;
      const best = this.state.findBestInteractable(this.state.player.x, this.state.player.z, 0.3, preferredId);
      if (!best) return false;
      const res = this.state.executeInteraction(best.action);
      if (res.kind === 'request_dive') {
        const orbId = res.targetWorld;
        const ped = res.pedestal;
        const tint = ECHO.ORB_META[orbId] ? ECHO.ORB_META[orbId].emissive : [1, 0.9, 0.7];
        this.input.clearAll();
        this.audio.playWorldTransition(1, orbId);
        this.scene.particles.burst(ped.x, ped.y + 0.8, ped.z, 36, tint, 3.4, 0.2, 1.1, 2.2);
        this.camera.startTransition(
          1,
          [ped.x, ped.y + 0.85, ped.z],
          tint,
          () => { this.state.commitDive(orbId, ped); },
          null
        );
        return true;
      }
      if (res.kind === 'request_exit') {
        const ped = res.pedestal;
        const parentWorld = this.state.stack.length > 1 ? this.state.stack[this.state.stack.length - 2].world : 'pale';
        const tint = ECHO.ORB_META[this.state.currentWorldId]
          ? ECHO.ORB_META[this.state.currentWorldId].emissive
          : [0.95, 0.95, 1.0];
        this.input.clearAll();
        this.audio.playWorldTransition(-1, parentWorld);
        this.scene.particles.burst(ped.x, ped.y + 1.0, ped.z, 34, [0.95, 0.98, 1.0], 3.2, 0.2, 1.1, 3.2);
        this.camera.startTransition(
          -1,
          [ped.x, ped.y + 0.85, ped.z],
          tint,
          () => { this.state.commitExit(); },
          null
        );
        return true;
      }
      return !!res.ok;
    }

    handleWorldClick(clientX, clientY) {
      if (this.mode !== 'playing' || this.camera.transition.active || this.state.flags.endingTriggered) return;
      const rect = this.canvas.getBoundingClientRect();
      const hit = this.camera.screenToWorldPlane(clientX, clientY, rect, this.state.player.y);
      if (!hit) return;

      // 1. Check if user clicked near an interactable (generous 2.1m pick radius)
      let clickedIt = null;
      let bestD = 2.15;
      for (const it of this.state.currentWorld.interactables) {
        const d = Math.hypot(it.x - hit.x, it.z - hit.z);
        if (d < bestD && this.state.describeInteraction(it)) {
          bestD = d;
          clickedIt = it;
        }
      }

      if (clickedIt) {
        const curD = Math.hypot(clickedIt.x - this.state.player.x, clickedIt.z - this.state.player.z);
        if (curD <= clickedIt.radius + 0.3) {
          this.tryInteract(clickedIt.id);
          return;
        }
        this.input.clickPath = this.state.findPath(this.state.player.x, this.state.player.z, clickedIt.x, clickedIt.z);
        this.input.pendingInteractId = clickedIt.id;
        return;
      }

      // 2. Otherwise pathfind to clicked walkable surface!
      if (this.state.sampleWalkable(this.state.currentWorldId, hit.x, hit.z, this.state.player.y)) {
        this.input.clickPath = this.state.findPath(this.state.player.x, this.state.player.z, hit.x, hit.z);
        this.input.pendingInteractId = null;
      }
    }

    // Fixed 60Hz logic tick
    stepLogic(dt) {
      this.state.stepAnimations(dt);
      this.renderer.stepRipples(dt);

      if (this.mode === 'playing' && !this.camera.transition.active && !this.state.flags.endingTriggered) {
        const p = this.state.player;
        const speed = p.carriedOrb ? 5.15 : 5.9;
        const { sx, sy } = this.input.getScreenInput();

        let moveX = 0, moveZ = 0;
        if (Math.hypot(sx, sy) > 0.05) {
          // Screen-aligned directional movement derived directly from active camera XZ basis!
          moveX = this.camera._camRightXZ[0] * sx + this.camera._camFwdXZ[0] * sy;
          moveZ = this.camera._camRightXZ[2] * sx + this.camera._camFwdXZ[2] * sy;
          const ml = Math.hypot(moveX, moveZ) || 1;
          moveX = (moveX / ml) * speed * Math.min(1, Math.hypot(sx, sy));
          moveZ = (moveZ / ml) * speed * Math.min(1, Math.hypot(sx, sy));
          this.state.hintsDone.move = true;
        } else if (this.input.clickPath.length > 0) {
          const wp = this.input.clickPath[0];
          const dx = wp.x - p.x, dz = wp.z - p.z;
          const d = Math.hypot(dx, dz);
          if (d < 0.42) {
            this.input.clickPath.shift();
            if (this.input.clickPath.length === 0 && this.input.pendingInteractId) {
              const targetId = this.input.pendingInteractId;
              this.input.pendingInteractId = null;
              const it = this.state.getInteractableById(this.state.currentWorldId, targetId);
              if (it && Math.hypot(it.x - p.x, it.z - p.z) <= it.radius + 0.65) {
                this.tryInteract(targetId);
              }
            }
          } else {
            moveX = (dx / d) * speed;
            moveZ = (dz / d) * speed;
            this.state.hintsDone.move = true;
          }
        }

        // Smooth velocity inertia & turning
        const accel = Math.hypot(moveX, moveZ) > 0.1 ? 11.5 : 13.5;
        p.vx += (moveX - p.vx) * Math.min(1, dt * accel);
        p.vz += (moveZ - p.vz) * Math.min(1, dt * accel);

        if (Math.hypot(p.vx, p.vz) > 0.06) {
          this.state.movePlayer(p.vx * dt, p.vz * dt);
          const wantYaw = Math.atan2(p.vx, p.vz);
          p.facing += ECHO.Math.angleDiff(p.facing, wantYaw) * Math.min(1, dt * 11.0);
        } else {
          p.vx = 0; p.vz = 0;
        }
      } else {
        this.state.player.vx *= 0.85;
        this.state.player.vz *= 0.85;
      }

      this.nearestInteractable = (this.mode === 'playing' && !this.camera.transition.active && !this.state.flags.endingTriggered)
        ? this.state.findBestInteractable(this.state.player.x, this.state.player.z, 0.25)
        : null;

      // Update creature procedural gait, footsteps & Verdant water ripples
      this.scene.creature.update(dt, this.state, this.nearestInteractable, (x, y, z, wId) => {
        this.audio.playFootstep(wId);
        if (wId === 'verdant') {
          this.renderer.addWaterRipple(x, z, 0.72);
        }
      });

      // Update camera, particles & procedural audio
      this.camera.update(dt, this.state, this.mode);
      this.scene.particles.update(dt, this.state.currentWorldId, this.camera.target, this.renderer.qualityTier);
      this.audio.update(dt, this.state, this.nearestInteractable);

      // World title banner & minimalist one-time hint fade
      if (this.worldBanner.timer > 0) {
        this.worldBanner.timer -= dt;
        const a = this.worldBanner.timer > 2.4 ? (3.2 - this.worldBanner.timer) / 0.8
                : this.worldBanner.timer < 0.9 ? this.worldBanner.timer / 0.9
                : 1.0;
        this.worldBanner.alpha = ECHO.Math.clamp(a, 0, 1);
      } else {
        this.worldBanner.alpha = 0;
      }

      // One-time contextual minimal control hint (vanishes forever once performed!)
      let wantHint = '';
      if (this.mode === 'playing' && !this.state.flags.endingTriggered && !this.camera.transition.active) {
        if (!this.state.hintsDone.move && this.state.elapsedTime > 1.2) {
          wantHint = 'WASD  ·  CLICK';
        } else if (!this.state.hintsDone.interact && this.nearestInteractable) {
          wantHint = 'SPACE  ·  E';
        }
      }
      if (wantHint) {
        this.activeHintText = wantHint;
        this.hintAlpha = Math.min(1, this.hintAlpha + dt * 2.4);
      } else {
        this.hintAlpha = Math.max(0, this.hintAlpha - dt * 3.0);
      }

      // Ending typography choreography (wordless cosmic reveal -> ECHO -> quote)
      if (this.state.flags.endingTriggered) {
        const et = this.state.endingTime;
        this.endingTitleAlpha = ECHO.Math.smoothstep(15.0, 18.5, et);
        this.endingSubAlpha = ECHO.Math.smoothstep(18.5, 22.0, et);
        if (et > 22.5 && !this.endingBtnShown) {
          this.endingBtnShown = true;
          this.elEnding.classList.add('visible');
        }
      }
    }

    // Minimalist Canvas2D Overlay (pure poetic geometry: nested depth rings, first-visit world name, one-time hint, ending quote)
    renderOverlay2D() {
      const ctx = this.ctx2d;
      const w = this.overlay.width;
      const h = this.overlay.height;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      ctx.clearRect(0, 0, w, h);

      if (this.mode !== 'playing') return;
      ctx.save();
      ctx.scale(dpr, dpr);
      const cw = w / dpr;
      const ch = h / dpr;

      const isPaleBright = this.state.currentWorldId === 'pale' && !this.state.flags.endingTriggered;
      const ink = isPaleBright ? 'rgba(34, 40, 48,' : 'rgba(246, 242, 232,';

      // 1. Minimalist Geometric Nesting-Depth Signifier (bottom-left on desktop; top-left on mobile so joystick stays clear!)
      if (!this.state.flags.endingTriggered) {
        const chain = this.state.getWorldChain();
        const isCompact = cw <= 920;
        const cx = isCompact ? 34 : 36;
        const cy = isCompact ? 32 : ch - 36;
        const colMap = {
          pale:    isPaleBright ? 'rgba(60, 68, 78, 0.55)' : 'rgba(232, 236, 242, 0.55)',
          amber:   'rgba(245, 178, 78, 0.85)',
          verdant: 'rgba(84, 224, 166, 0.85)',
          violet:  'rgba(186, 146, 252, 0.88)'
        };
        for (let i = 0; i < chain.length; i++) {
          const rad = 18 - i * 4.4;
          ctx.beginPath();
          ctx.arc(cx, cy, Math.max(3, rad), 0, Math.PI * 2);
          ctx.strokeStyle = colMap[chain[i]] || 'rgba(255,255,255,0.6)';
          ctx.lineWidth = i === chain.length - 1 ? 1.8 : 1.15;
          ctx.stroke();
        }
        // Tiny solid center dot if carrying an orb!
        if (this.state.player.carriedOrb) {
          ctx.beginPath();
          ctx.arc(cx, cy, 2.4, 0, Math.PI * 2);
          ctx.fillStyle = colMap[this.state.player.carriedOrb];
          ctx.fill();
        }
      }

      // 2. First-Visit World Title Reveal (brief, wide-tracked, disappears forever)
      if (this.worldBanner.alpha > 0.01) {
        ctx.save();
        ctx.font = '300 22px "Cinzel", "Optima", "Georgia", serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = ink + (this.worldBanner.alpha * 0.88).toFixed(3) + ')';
        const spaced = this.worldBanner.text.split('').join('   ');
        ctx.fillText(spaced, cw * 0.5, ch * 0.16);
        ctx.restore();
      }

      // 3. One-Time Minimal Control Cue (disappears permanently once done)
      if (this.hintAlpha > 0.01 && this.activeHintText) {
        ctx.save();
        ctx.font = '400 11px "Inter", system-ui, -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = ink + (this.hintAlpha * 0.62).toFixed(3) + ')';
        ctx.fillText(this.activeHintText, cw * 0.5, ch - 34);
        ctx.restore();
      }

      // 4. Ending Title & Quote ("Every world is a world within.") framed cleanly in serene upper cosmos
      if (this.state.flags.endingTriggered && this.endingTitleAlpha > 0.01) {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(8, 6, 20, 0.72)';
        ctx.shadowBlur = 18;
        ctx.font = '300 44px "Cinzel", "Optima", "Georgia", serif';
        ctx.fillStyle = 'rgba(250, 247, 240, ' + (this.endingTitleAlpha * 0.96).toFixed(3) + ')';
        ctx.fillText('E   C   H   O', cw * 0.5, ch * 0.165);
        if (this.endingSubAlpha > 0.01) {
          ctx.font = '300 16px "Cinzel", "Optima", "Georgia", serif';
          ctx.fillStyle = 'rgba(232, 236, 248, ' + (this.endingSubAlpha * 0.88).toFixed(3) + ')';
          ctx.fillText('Every world is a world within.', cw * 0.5, ch * 0.235);
        }
        ctx.restore();
      }

      ctx.restore();
    }

    // Dynamic FPS quality governor (target 60 FPS, degrades smoothly without affecting gameplay logic!)
    _governQuality(frameMs) {
      if (frameMs > 0 && frameMs < 250) {
        this.fpsSamples.push(1000 / frameMs);
        if (this.fpsSamples.length > 45) this.fpsSamples.shift();
      }
      this.fpsCheckTimer += frameMs;
      if (this.fpsCheckTimer > 2600 && this.fpsSamples.length >= 25) {
        this.fpsCheckTimer = 0;
        const avg = this.fpsSamples.reduce((a, b) => a + b, 0) / this.fpsSamples.length;
        this.currentFps = avg;
        if (avg < 36 && this.renderer.qualityTier > 0) {
          this.renderer.setQualityTier(this.renderer.qualityTier - 1);
        } else if (avg > 55 && this.renderer.qualityTier < 2) {
          this.renderer.setQualityTier(this.renderer.qualityTier + 1);
        }
      }
    }

    _loop(now) {
      if (this.destroyed) return;
      requestAnimationFrame((t) => this._loop(t));

      const rawMs = now - this.lastTime;
      this.lastTime = now;
      if (document.hidden) return; // pause cleanly when tab backgrounded

      this._governQuality(rawMs);

      const dt = Math.min(rawMs * 0.001, 0.1); // cap spiral of death
      this.accumulator += dt;
      let sub = 0;
      while (this.accumulator >= this.fixedDt && sub++ < 5) {
        this.stepLogic(this.fixedDt);
        this.accumulator -= this.fixedDt;
      }

      const tr = this.camera.transition;
      this.scene.renderFrame(this.state, this.camera, this.nearestInteractable, {
        active: tr.active,
        progress: tr.active ? ECHO.Math.clamp(tr.t / tr.dur, 0, 1) : 0,
        center: tr.center,
        dir: tr.dir,
        tint: tr.tint
      });
      this.renderOverlay2D();
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    ECHO.game = new EchoGame();
  });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
